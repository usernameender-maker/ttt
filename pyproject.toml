[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ievf-fault-tolerance-primitives"
version = "0.1.0"
description = "Fail-closed validation and checkpoint recovery primitives for IEVF research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
native = ["numpy>=1.26,<3", "pybind11>=2.12,<4"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["fault_tolerance"]

[tool.setuptools.packages.find]
where = ["src"]
