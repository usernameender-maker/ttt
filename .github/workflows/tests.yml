name: IEVF Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record environment
        run: |
          python --version
          python -m pip --version
      - name: Build wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - name: Install wheel into clean virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --no-deps wheelhouse/*.whl
      - name: Run unit tests without PYTHONPATH
        shell: bash
        run: |
          set -o pipefail
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          python --version || true
          python -m pip --version || true
          python -m pip list || true
          find . -maxdepth 3 -type f -print | sort || true
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-python-${{ matrix.python-version }}
          path: test-results.txt
          if-no-files-found: ignore
