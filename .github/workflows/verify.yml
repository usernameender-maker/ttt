name: TVE-1 CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Build distributable wheel
        run: python -m build --wheel

      - name: Validate bounded scenario guards
        run: |
          python - <<'PY'
          from ievf.batch_runner import BatchRunner, BatchScenario

          estimate = BatchRunner._validate(BatchScenario(name="ci-smoke", m=2, k=3, n=4))
          assert estimate > 0

          try:
              BatchRunner._validate(
                  BatchScenario(name="over-budget", m=1024, k=1024, n=1024, max_memory_bytes=1)
              )
          except ValueError:
              pass
          else:
              raise AssertionError("over-budget scenario was not rejected")
          PY
